settings.help=<html>Выбранный аккаунт записывается в <b>локальный</b> конфиг текущего репозитория. <b>Логин GitHub</b> добавляется в HTTPS remote URL (https://login@github.com/…), поэтому push идёт от этого аккаунта, а соответствующий аккаунт IDE становится аккаунтом проекта по умолчанию. ✓ в столбце <b>IDE</b> означает, что аккаунт подключён в Settings → Version Control → GitHub и его репозитории видны в Git → Clone. Для SSH remote укажите путь к ключу этого аккаунта (например, <code>~/.ssh/id_work</code>).</html>
