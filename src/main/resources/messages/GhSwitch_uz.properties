settings.help=<html>Akkaunt tanlanganda u joriy repozitoriyning <b>lokal</b> configiga yoziladi. <b>GitHub login</b> HTTPS remote URLga qo'shiladi (https://login@github.com/…), shunda push aynan shu akkaunt bilan bo'ladi va IDE dagi shu akkaunt loyiha uchun default bo'ladi. <b>IDE</b> ustunida ✓ bo'lsa, akkaunt Settings → Version Control → GitHub da ulangan va Git → Clone oynasida uning repolari ko'rinadi. SSH remote uchun shu akkauntning kalit yo'lini kiriting (masalan <code>~/.ssh/id_work</code>).</html>
