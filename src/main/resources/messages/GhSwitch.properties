settings.help=<html>The selected account is written to the current repository's <b>local</b> config. The <b>GitHub login</b> is added to HTTPS remote URLs (https://login@github.com/…) so pushes use that account, and the matching IDE account becomes the project default. A ✓ in the <b>IDE</b> column means the account is connected in Settings → Version Control → GitHub and its repositories appear in Git → Clone. For SSH remotes, enter that account's key path (e.g. <code>~/.ssh/id_work</code>).</html>
